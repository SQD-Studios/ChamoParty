#########################################################################################################################################
#   
#   Documentation: https://github.com/SQD-Studios/ChamoParty/wiki
#   Source: https://github.com/SQD-Studios/ChamoParty
#      _____ _                          ______          _
#    /  __ \ |                         | ___ \        | |
#    | /  \/ |__   __ _ _ __ ___   ___ | |_/ /_ _ _ __| |_ _   _
#    | |   | '_ \ / _` | '_ ` _ \ / _ \|  __/ _` | '__| __| | | |
#    | \__/\ | | | (_| | | | | | | (_) | | | (_| | |  | |_| |_| |
#    \____/_| |_|\__,_|_| |_| |_|\___/\_|  \__,_|_|   \__|\__, |
#                                                          __/ |
#   Commands and permissions:
#   - /vote » Open vote inventory - chamoparty.vote
#   - /chamoparty » Show needed votes for vote party (aliases: /vp, /voteparty) - chamoparty.use
#   - /chamoparty reload » Reload configuration - chamoparty.reload
#   - /chamoparty version » Show plugin version
#   - /chamoparty help » Send commands description and syntax - chamoparty.help
#   - /chamoparty add » Add vote to player - chamoparty.add
#   - /chamoparty startparty » Force launch a Vote Party - chamoparty.startparty
#   
#   Placeholders:
#   - %chamoparty_votes_recorded% » Returns the current amount of votes in the Vote Party.   
#   - %chamoparty_votes_required_party% » Returns the amount of votes left that are needed for a Vote Party to happen.
#   - %chamoparty_votes_required_total% » Returns the total amount of votes needed for a Vote Party to happen.
#   - %chamoparty_player_votes% » Returns the total amount of votes a player has.
#   - %chamoparty_votes_progressbar% » Return a progress bar for the vote party
#   
#   
#########################################################################################################################################

# Rewards when a player goes to vote
rewards:
  1:
    percent: 10
    needToBeOnline: false # Player must not be online to receive the reward
    commands:
      - "eco give %player% 100"
    broadcast:
      - "<white>%player% <gray>just won <green>$100"
  2:
    percent: 30
    needToBeOnline: true # Player must be online to receive the reward
    commands:
      - "give %player% minecraft:stone 10"
    broadcast:
      - "<white>%player% <gray>just won <green>x10 stone"
  3:
    percent: 30
    needToBeOnline: false # Player must not be online to receive the reward
    commands:
      - "eco give %player% 500"
    broadcast: []
  4:
    percent: 30
    needToBeOnline: true # Player must be online to receive the reward
    commands:
      - "cr give %player% diamond"
    broadcast:
      - "<gray><st>----------"
      - "<white>%player% <gray>just won <green>x1 diamond"
      - "<gray><st>----------"

party:
  # The amount of votes needed
  votes_needed: 50

  # The command that will be executed when the number of votes is reached for each online players
  global_commands:
    - "eco give %player% 100"

  # This command will be executed in the console, you cannot specify a player here
  commands:
    - "eco give * 0.0000000009"
  # Sound to be played after Vote Party is triggered.
  # Sound: <SOUND>:<VOLUME>:<PITCH> - Name of the sound to play. A list of available sounds is found here: https://docs.andre601.ch/Spigot-Sounds/sounds/1.21.x/1.21.4/
  Sound: UI_TOAST_CHALLENGE_COMPLETE:1:2

  # Rewards that the player can get randomly
  rewards:
    1:
      percent: 50
      commands:
        - "give %player% minecraft:diamond 1"
    2:
      percent: 50
      commands:
        - "cr give %player% test"
  only-voters-rewards: true

database:
  # JSON (one-server), REDIS (Multi-Server, requires a SQL Database too)
  type: JSON

  # Redis Only
  redis:
    sql:
    # Types are MYSQL or MARIADB
      sql-database: MYSQL
      sql-credentials:
        user: "homestead"
        password: "secret"
        port: 3306
        host: "192.168.10.10"
        database: "chamoparty"
        max-retry-amount: 5
    # Currently does nothing. Go to config.json
    redis-credentials:
      server-amount: 2
      channel: chamoparty
      host: "localhost"
      port: 6379
      password: null
      databaseIndex: 0
      poolConfig:
        maxTotal: 128
        maxIdle: 128
        minIdle: 16

debug:
  enabled: false

action-vote-announcement: false
tchat-vote-annonce: false

vote-inventory:
  enabled: true

# Currently does nothing
proxy:
  is-this-proxy: false # Is this the proxy?
  proxy-mode: false # If servers running on a proxy
  plugin-messaging: false # Not implemented