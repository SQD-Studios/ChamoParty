name: '<aqua>Vote'
size: 27
items:
  fill:
    item:
      material: GRAY_STAINED_GLASS_PANE
    slots:
      - 0-10
      - 12-14
      - 16-26
  vote-link:
    slot: 11
    item:
      material: HOPPER
      name: '<yellow>Vote'
      lore:
        - '<white><b>| <dark_gray>Click to vote on'
        - '  <aqua>(replace_your_vote_link_here)'
        - ''
        - '<dark_blue>[!] <dark_gray>You can vote every'
        - '<dark_gray>(How often they can vote)'
    close-inventory: true
    actions:
      - type: message
        messages:
          - '<white>Hey <aqua>%player% <white>click here to vote'
          - '<gray>(replace_your_vote_link_here)'
        mini-message: true
  player-head:
    slot: 15
    item:
      material: PLAYER_HEAD
      player-head: "%player%"
      name: '<green>%player%'
      lore:
        - '<white><b>| <gray>You have <white>%chamoparty_player_votes%<gray> votes'
        - ''
        - '<white><b>| <light_purple>VoteParty <dark_gray>- <aqua>%chamoparty_votes_recorded% <dark_gray>/ <green>%chamoparty_votes_required_total%'
        - '<white><b>| %chamoparty_votes_progressbar%'